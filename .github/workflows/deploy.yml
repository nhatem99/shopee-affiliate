name: Deploy

on:
  push:
    branches: [main]

  # Deploy tay MỘT NHÁNH KHÁC lên thẳng production — để bấm thử giao diện thật trước khi
  # merge. Đây là site đang phục vụ khách: mọi người vào tietkiemvi.com sẽ thấy ngay code
  # của nhánh đó. Quay lại bản ổn định = chạy lại workflow này với ref = main.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Nhánh muốn deploy lên production (để main nếu muốn quay về bản ổn định)'
        required: true
        default: main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Input đi qua biến môi trường rồi mới dùng có nháy kép trong script —
          # không nội suy thẳng ${{ }} vào shell. Push vào main thì inputs rỗng.
          DEPLOY_REF: ${{ inputs.ref || 'main' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_REF
          script: |
            set -e
            cd /var/www/tietkiemvi.com

            echo "Deploying ref: $DEPLOY_REF"
            # Refspec tường minh để deploy được cả nhánh không nằm trong refspec mặc định
            # (repo deploy có thể là clone --single-branch chỉ theo dõi main).
            git fetch origin "+refs/heads/$DEPLOY_REF:refs/remotes/origin/$DEPLOY_REF"
            git reset --hard "origin/$DEPLOY_REF"

            composer install --no-dev --optimize-autoloader --no-interaction

            npm ci
            npm run build

            php8.4 artisan migrate --force
            php8.4 artisan db:seed --class=ApiConfigSeeder --force
            php8.4 artisan optimize:clear
            php8.4 artisan optimize

            chown -R www-data:www-data /var/www/tietkiemvi.com
            chmod -R 775 storage bootstrap/cache

            systemctl restart php8.4-fpm
            php8.4 artisan queue:restart

            echo "Deploy complete: $(git rev-parse --short HEAD)"
