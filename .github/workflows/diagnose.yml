name: Diagnose

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Check server state
    runs-on: ubuntu-latest

    steps:
      - name: SSH and inspect
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/tietkiemvi.com
            echo "--- git commit ---"
            git log -1 --format="%H %s"
            echo "--- next_action / tool_id dang chay tren dia ---"
            grep -n "next_action\|tool_id\|endpoint" config/services.php || echo "NOT FOUND"
            echo "--- recent kieushopee log lines ---"
            tail -n 200 storage/logs/laravel.log | grep -i "kieushopee" || echo "no matching log lines"
            echo "--- php-fpm status ---"
            systemctl is-active php8.4-fpm
            echo "--- goi thu bang chinh service cua app (bo qua cache) ---"
            php artisan kieushopee:check "https://shopee.vn/-CLUBLU-M%C3%A1y-%E1%BA%A2nh-Mini-K%E1%BB%B9-Thu%E1%BA%ADt-S%E1%BB%91-Digital-Camera-HD-Ho%E1%BA%A1t-H%C3%ACnh-D%E1%BB%85-Th%C6%B0%C6%A1ng-C%C3%B3-Th%E1%BB%83-Ph%C3%B9-H%E1%BB%A3p-V%E1%BB%9Bi-Tr%E1%BA%BB-Em-i.1096140180.22987662374" || true
            echo "--- server IP cua chinh no (de doi chieu co bi chan theo IP khong) ---"
            curl -s https://api.ipify.org --max-time 10
            echo
            echo "--- nginx: co dong ghi de HTTP_X_FORWARDED_FOR cho fastcgi khong? ---"
            grep -rniE "X-Forwarded-For|X_FORWARDED_FOR|fastcgi_param|proxy_set_header" /etc/nginx/sites-enabled/ 2>/dev/null || echo "khong tim thay trong sites-enabled"
            echo "--- toan bo server block cua tietkiemvi.com de doi chieu ---"
            find /etc/nginx/sites-enabled/ -iname "*tietkiem*" -exec cat {} \; 2>/dev/null || echo "khong tim thay file config rieng"
